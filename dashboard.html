<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF Agent Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }

  /* ── Top Bar ── */
  .topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { font-size: 16px; color: #58a6ff; white-space: nowrap; }
  .topbar .spacer { flex: 1; }
  .topbar .status-badge { font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid #30363d; }
  .status-running { color: #3fb950; border-color: #3fb950; }
  .status-idle { color: #8b949e; }

  /* ── Setup Panel ── */
  .setup { background: #161b22; border-bottom: 1px solid #30363d; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .setup label { font-size: 12px; color: #8b949e; }
  .setup select, .setup input[type="text"] { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 13px; }
  .setup select { width: 100px; }
  .setup input[type="text"] { min-width: 200px; }
  .setup .hint-input { flex: 1; min-width: 300px; }
  .btn { padding: 5px 16px; border-radius: 4px; border: 1px solid #30363d; cursor: pointer; font-family: inherit; font-size: 13px; }
  .btn-start { background: #238636; border-color: #238636; color: #fff; }
  .btn-start:hover { background: #2ea043; }
  .btn-start:disabled { background: #21262d; color: #484f58; cursor: not-allowed; border-color: #30363d; }
  .btn-stop { background: #da3633; border-color: #da3633; color: #fff; }
  .btn-stop:hover { background: #f85149; }
  .btn-stop:disabled { background: #21262d; color: #484f58; cursor: not-allowed; border-color: #30363d; }
  .hidden { display: none !important; }

  /* ── Status Bar ── */
  .statusbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 6px 16px; display: flex; gap: 20px; font-size: 12px; align-items: center; flex-wrap: wrap; }
  .statusbar .item { display: flex; gap: 4px; }
  .statusbar .label { color: #8b949e; }
  .statusbar .value { color: #c9d1d9; }
  .statusbar .flag-found { color: #3fb950; font-weight: bold; }

  /* ── Log Panels ── */
  .logs { flex: 1; display: flex; overflow: hidden; }
  .log-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .log-panel + .log-panel { border-left: 1px solid #30363d; }
  .log-header { padding: 6px 12px; font-size: 12px; font-weight: bold; color: #8b949e; background: #161b22; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
  .log-header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot-codex { background: #58a6ff; }
  .dot-hermes { background: #bc8cff; }
  .log-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; }
  .log-body::-webkit-scrollbar { width: 6px; }
  .log-body::-webkit-scrollbar-track { background: transparent; }
  .log-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .auto-scroll { font-size: 11px; color: #8b949e; cursor: pointer; }
  .auto-scroll:hover { color: #58a6ff; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>🎯 CTF Agent</h1>
  <span class="status-badge status-idle" id="statusBadge">IDLE</span>
  <div class="spacer"></div>
  <span style="font-size:12px;color:#8b949e" id="workDir"></span>
</div>

<!-- Setup Panel -->
<div class="setup" id="setupPanel">
  <label>类型</label>
  <select id="challengeType" onchange="onTypeChange()">
    <option value="web">Web</option>
    <option value="crypto">Crypto</option>
    <option value="misc">Misc</option>
  </select>
  <label id="urlLabel">URL</label>
  <input type="text" id="urlInput" placeholder="http://target:8080" />
  <div id="attachmentWrap" class="hidden">
    <label>附件</label>
    <input type="text" id="attachmentInput" placeholder="/path/to/challenge.zip" />
  </div>
  <label>背景</label>
  <input type="text" id="hintInput" class="hint-input" placeholder="题目背景信息" />
  <button class="btn btn-start" id="btnStart" onclick="startChallenge()">启动</button>
  <button class="btn btn-stop" id="btnStop" onclick="stopChallenge()" disabled>停止</button>
</div>

<!-- Status Bar -->
<div class="statusbar" id="statusBar">
  <div class="item"><span class="label">Phase:</span><span class="value" id="phaseVal">-</span></div>
  <div class="item"><span class="label">Round:</span><span class="value" id="roundVal">-</span></div>
  <div class="item"><span class="label">Flags:</span><span class="value" id="flagsVal">-</span></div>
  <div class="item"><span class="label">Subagents:</span><span class="value" id="subagentsVal">-</span></div>
</div>

<!-- Log Panels -->
<div class="logs">
  <div class="log-panel">
    <div class="log-header">
      <span><span class="dot dot-codex"></span>Codex 实时日志</span>
      <span class="auto-scroll" id="codexAutoScroll" onclick="toggleAutoScroll('codex')">⏸ 自动滚动</span>
    </div>
    <div class="log-body" id="codexLog"></div>
  </div>
  <div class="log-panel">
    <div class="log-header">
      <span><span class="dot dot-hermes"></span>Hermes 思考与决策</span>
      <span class="auto-scroll" id="hermesAutoScroll" onclick="toggleAutoScroll('hermes')">⏸ 自动滚动</span>
    </div>
    <div class="log-body" id="hermesLog"></div>
  </div>
</div>

<script>
// ─── State ───
let autoScroll = { codex: true, hermes: true };
let codexES = null, hermesES = null, statusTimer = null;

// ─── Type Switch ───
function onTypeChange() {
  const type = document.getElementById('challengeType').value;
  const isWeb = type === 'web';
  document.getElementById('urlLabel').textContent = isWeb ? 'URL' : 'URL';
  document.getElementById('urlInput').classList.toggle('hidden', !isWeb);
  document.getElementById('attachmentWrap').classList.toggle('hidden', isWeb);
}

// ─── Start / Stop ───
async function startChallenge() {
  const type = document.getElementById('challengeType').value;
  const url = document.getElementById('urlInput').value.trim();
  const attachment = document.getElementById('attachmentInput').value.trim();
  const hint = document.getElementById('hintInput').value.trim();

  const body = { type, hint };
  if (type === 'web') body.url = url;
  else body.attachment = attachment;

  // 清空日志
  document.getElementById('codexLog').textContent = '';
  document.getElementById('hermesLog').textContent = '';

  const resp = await fetch('/api/start', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await resp.json();
  if (!resp.ok) { alert(data.error || '启动失败'); return; }

  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('statusBadge').textContent = 'RUNNING';
  document.getElementById('statusBadge').className = 'status-badge status-running';
  document.getElementById('workDir').textContent = data.work_dir || '';

  connectSSE();
  startStatusPolling();
}

async function stopChallenge() {
  await fetch('/api/stop', { method: 'POST' });
  onChallengeEnded();
}

function onChallengeEnded() {
  document.getElementById('btnStart').disabled = false;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('statusBadge').textContent = 'IDLE';
  document.getElementById('statusBadge').className = 'status-badge status-idle';
  if (codexES) { codexES.close(); codexES = null; }
  if (hermesES) { hermesES.close(); hermesES = null; }
  if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
}

// ─── SSE ───
function connectSSE() {
  if (codexES) codexES.close();
  if (hermesES) hermesES.close();

  codexES = new EventSource('/api/logs/codex');
  codexES.addEventListener('batch', e => appendLog('codex', e.data));
  codexES.addEventListener('append', e => appendLog('codex', e.data));
  codexES.addEventListener('error', e => { if (codexES.readyState === 2) setTimeout(() => { if (!document.getElementById('btnStop').disabled) connectCodexSSE(); }, 2000); });

  hermesES = new EventSource('/api/logs/hermes');
  hermesES.addEventListener('batch', e => appendLog('hermes', e.data));
  hermesES.addEventListener('append', e => appendLog('hermes', e.data));
}

function connectCodexSSE() {
  codexES = new EventSource('/api/logs/codex');
  codexES.addEventListener('batch', e => appendLog('codex', e.data));
  codexES.addEventListener('append', e => appendLog('codex', e.data));
}

function appendLog(panel, text) {
  const el = document.getElementById(panel + 'Log');
  el.textContent += text;
  if (autoScroll[panel]) el.scrollTop = el.scrollHeight;
}

function toggleAutoScroll(panel) {
  autoScroll[panel] = !autoScroll[panel];
  document.getElementById(panel + 'AutoScroll').textContent = autoScroll[panel] ? '⏸ 自动滚动' : '▶ 手动';
}

// ─── Status Polling ───
function startStatusPolling() {
  if (statusTimer) clearInterval(statusTimer);
  pollStatus();
  statusTimer = setInterval(pollStatus, 3000);
}

async function pollStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();

    document.getElementById('phaseVal').textContent = data.phase || '-';
    document.getElementById('roundVal').textContent = data.round || '-';
    const flags = data.flags && data.flags !== '(无)' ? data.flags : '-';
    const flagsEl = document.getElementById('flagsVal');
    flagsEl.textContent = flags;
    flagsEl.className = flags !== '-' ? 'value flag-found' : 'value';

    const subs = (data.subagents || []).map(s => `${s.id}(${s.status})`).join(', ');
    document.getElementById('subagentsVal').textContent = subs || '-';

    if (!data.running && !document.getElementById('btnStart').disabled) {
      // 已结束
    } else if (!data.running && document.getElementById('btnStart').disabled) {
      onChallengeEnded();
    }
  } catch (e) {}
}

// ─── Init ───
onTypeChange();
// 页面加载时检查是否有运行中的挑战
pollStatus();
</script>
</body>
</html>
