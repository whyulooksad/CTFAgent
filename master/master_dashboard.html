<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTF Master 调度台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
         background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }

  /* ── Top Bar ── */
  .topbar { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px;
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; color: #58a6ff; white-space: nowrap; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 12px; border: 1px solid #30363d; color: #8b949e; }
  .badge b { color: #c9d1d9; }
  .badge.solved b { color: #3fb950; }
  .badge.paused { color: #d29922; border-color: #d29922; }
  .badge.plat-on { color: #3fb950; border-color: #3fb950; }
  .badge.plat-off { color: #f85149; border-color: #f85149; }
  .spacer { flex: 1; }

  /* ── Sections ── */
  .section { background: #161b22; border-bottom: 1px solid #30363d; padding: 8px 16px;
             display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; font-size: 12px; }
  .section .sec-title { color: #8b949e; white-space: nowrap; padding-top: 5px; width: 74px; }

  /* 手动加题行 */
  #manual-rows { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 500px; }
  .m-row { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }
  .m-row select, .m-row input[type=text], .m-row input[type=password] {
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .m-row select { width: 86px; }
  .m-row .in-title { width: 150px; }
  .m-row .in-url, .m-row .in-attach { width: 260px; }
  .m-row .in-desc { flex: 1; min-width: 160px; }
  .m-row .hidden-field { display: none; }
  .btn { padding: 4px 14px; border-radius: 4px; border: 1px solid #30363d; cursor: pointer;
         font-family: inherit; font-size: 12px; background: #21262d; color: #c9d1d9; white-space: nowrap; }
  .btn-add { background: #1f6feb; border-color: #1f6feb; color: #fff; padding: 4px 12px; font-weight: bold; }
  .btn-del { background: transparent; border-color: #30363d; color: #8b949e; padding: 4px 9px; }
  .btn-go { background: #238636; border-color: #238636; color: #fff; }
  .btn-warn { background: #9e6a03; border-color: #9e6a03; color: #fff; }
  .btn-danger { background: #da3633; border-color: #da3633; color: #fff; }
  .btn-mini { padding: 1px 8px; font-size: 11px; }
  .msg { font-size: 12px; color: #8b949e; }
  .msg.ok { color: #3fb950; } .msg.err { color: #f85149; }

  /* 平台接入 / 配置行 */
  .inline-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .inline-row input { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
                      padding: 4px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .inline-row .in-api { width: 280px; } .inline-row .in-token { width: 170px; }
  .inline-row input[type=number] { width: 70px; }
  .inline-row .in-plat { width: 160px; }
  .badge.llm-on { color: #bc8cff; border-color: #bc8cff; }
  .badge.llm-off { color: #8b949e; }

  /* ── Table ── */
  .main { flex: 1; overflow: auto; padding: 10px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; color: #8b949e; font-weight: normal; padding: 6px 8px;
       border-bottom: 1px solid #30363d; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #21262d; vertical-align: top; }
  tr.running-row td { background: #10151d; }
  tr:hover td { background: #161b22; }
  .st { padding: 1px 8px; border-radius: 10px; font-size: 11px; white-space: nowrap; }
  .st-running { color: #58a6ff; border: 1px solid #58a6ff; }
  .st-flag_found { color: #bc8cff; border: 1px solid #bc8cff; }
  .st-submitted_correct { color: #3fb950; border: 1px solid #3fb950; }
  .st-queued, .st-dispatched { color: #8b949e; border: 1px solid #30363d; }
  .st-timeout, .st-failed { color: #f85149; border: 1px solid #f85149; }
  .st-manual_stop { color: #d29922; border: 1px solid #d29922; }
  .src-tag { font-size: 10px; color: #d29922; border: 1px dashed #d29922; border-radius: 8px; padding: 0 5px; margin-left: 4px; }
  .flag-cell { color: #3fb950; word-break: break-all; }
  .title-cell b { color: #c9d1d9; }
  .title-cell span { color: #8b949e; }
  .err { color: #f85149; font-size: 11px; }

  /* ── Flags 面板 ── */
  #flags-section { cursor: pointer; }
  #flags-section .sec-title { padding-top: 4px; }
  #flags-list { flex: 1; min-width: 300px; max-height: 110px; overflow-y: auto;
                display: flex; flex-direction: column; gap: 3px;
                font-size: 12px; padding-right: 4px; }
  #flags-list::-webkit-scrollbar { width: 6px; }
  #flags-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
  .flag-item { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .flag-item .f-time { color: #484f58; font-size: 11px; }
  .flag-item .f-title { color: #8b949e; }
  .flag-item .f-flag { color: #3fb950; word-break: break-all; }
  .flag-item .f-tag { font-size: 10px; border-radius: 8px; padding: 0 5px; }
  .f-tag.auto { color: #58a6ff; border: 1px solid #58a6ff; }
  .f-tag.manual { color: #d29922; border: 1px dashed #d29922; }
  .flags-empty { color: #484f58; font-size: 12px; padding-top: 3px; }

  /* ── Log Drawer ── */
  .drawer { border-top: 1px solid #30363d; background: #0d1117; height: 40%;
            display: none; flex-direction: column; }
  .drawer.open { display: flex; }
  .drawer-header { background: #161b22; padding: 6px 12px; display: flex; gap: 12px;
                   align-items: center; font-size: 12px; border-bottom: 1px solid #30363d; }
  .drawer-header .title { color: #58a6ff; font-weight: bold; }
  .logs { flex: 1; display: flex; overflow: hidden; }
  .log-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .log-panel + .log-panel { border-left: 1px solid #30363d; }
  .log-header { padding: 5px 12px; font-size: 12px; font-weight: bold; color: #8b949e;
                background: #161b22; border-bottom: 1px solid #30363d; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot-agent { background: #58a6ff; } .dot-hermes { background: #bc8cff; }
  .log-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.5;
              white-space: pre-wrap; word-break: break-all; }
  .log-body::-webkit-scrollbar { width: 6px; }
  .log-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <h1>CTF Master 调度台</h1>
  <div class="badge">槽位 <b id="slots">-</b></div>
  <div class="badge">尝试 <b id="attempted">-</b></div>
  <div class="badge solved">已解 <b id="solved">-</b> / <b id="score">-</b> 分</div>
  <div class="badge plat-off" id="plat-badge">平台: 未接入</div>
  <div class="badge llm-off" id="llm-badge">模型: 未接入</div>
  <div class="badge paused" id="standby-badge" style="display:none">待接入 (未调度)</div>
  <div class="badge paused" id="paused-badge" style="display:none">已暂停</div>
  <div class="spacer"></div>
  <button class="btn btn-warn" id="btn-pause" onclick="togglePause()">暂停调度</button>
</div>

<!-- 手动加题 -->
<div class="section">
  <div class="sec-title">手动加题<div style="font-size:10px;color:#484f58">local CTF</div></div>
  <div id="manual-rows"></div>
</div>
<div class="section">
  <div class="sec-title"></div>
  <div class="inline-row">
    <button class="btn btn-go" onclick="submitChallenges()">提交入队</button>
    <span class="msg" id="add-msg"></span>
  </div>
</div>

<!-- 平台接入 (赛方题目 API: 拉题/开靶机/提交) -->
<div class="section">
  <div class="sec-title">平台接入<div style="font-size:10px;color:#484f58">赛方题目 API</div></div>
  <div class="inline-row">
    <input type="text" class="in-plat" id="in-plat-name" placeholder="赛方平台名称，如 TSec">
    <input type="text" class="in-api" id="in-plat-url" placeholder="平台 API 地址，如 https://tsecbench.zc.tencent.com">
    <input type="password" class="in-token" id="in-plat-key" placeholder="api_key / Token" autocomplete="off">
    <button class="btn" onclick="connectPlatform()">接入</button>
    <span class="msg" id="plat-msg"></span>
  </div>
</div>

<!-- 运行时配置 -->
<div class="section">
  <div class="sec-title">调度配置</div>
  <div class="inline-row">
    <label style="color:#8b949e">并发 solver 数 <input type="number" id="in-solvers" min="1"></label>
    <label style="color:#8b949e">题目数上限 <input type="number" id="in-challenges" min="1"></label>
    <button class="btn" onclick="applyConfig()">应用</button>
    <span class="msg" id="config-msg"></span>
  </div>
</div>

<!-- Flags 面板 -->
<div class="section" id="flags-section">
  <div class="sec-title">Flags<div style="font-size:10px;color:#484f58" id="flags-count"></div></div>
  <div id="flags-list"><span class="flags-empty">暂无已解出的 flag</span></div>
</div>

<!-- Challenge Table -->
<div class="main">
  <table>
    <thead>
      <tr>
        <th>状态</th><th>题目</th><th>类型</th><th>分数</th><th>已解</th>
        <th>尝试</th><th>时长</th><th>flag</th><th>最近提交</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Log Drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <span class="title" id="drawer-title">-</span>
    <span style="color:#8b949e">claude (agent.log) / hermes.log 实时流</span>
    <div class="spacer"></div>
    <button class="btn btn-mini" onclick="closeDrawer()">关闭 ✕</button>
  </div>
  <div class="logs">
    <div class="log-panel">
      <div class="log-header"><span class="dot dot-agent"></span>Claude</div>
      <div class="log-body" id="log-agent"></div>
    </div>
    <div class="log-panel">
      <div class="log-header"><span class="dot dot-hermes"></span>Hermes</div>
      <div class="log-body" id="log-hermes"></div>
    </div>
  </div>
</div>

<script>
let esAgent = null, esHermes = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtElapsed = (s) => {
  if (s == null) return "-";
  const m = Math.floor(s / 60), h = Math.floor(m / 60);
  return h > 0 ? `${h}h${m % 60}m` : `${m}m${s % 60}s`;
};

/* ── 手动加题行 ── */
function addRow() {
  const row = document.createElement('div');
  row.className = 'm-row';
  row.innerHTML = `
    <select class="in-type" onchange="toggleFields(this)">
      <option value="web">web</option>
      <option value="crypto">crypto</option>
      <option value="misc">misc</option>
    </select>
    <input type="text" class="in-title" placeholder="题名 (可选)">
    <input type="text" class="in-url" placeholder="靶机 URL (web 必填)">
    <input type="text" class="in-attach hidden-field" placeholder="本地附件绝对路径 (必填)">
    <input type="text" class="in-desc" placeholder="题目描述 / hint">
    <button class="btn btn-del" onclick="this.parentElement.remove()">✕</button>
    <button class="btn btn-add" title="再加一题" onclick="addRow()">＋</button>`;
  document.getElementById('manual-rows').appendChild(row);
}

function toggleFields(sel) {
  const row = sel.parentElement;
  const isWeb = sel.value === 'web';
  row.querySelector('.in-url').classList.toggle('hidden-field', !isWeb);
  row.querySelector('.in-attach').classList.toggle('hidden-field', isWeb);
}

async function submitChallenges() {
  const items = [...document.querySelectorAll('.m-row')].map(row => ({
    type: row.querySelector('.in-type').value,
    title: row.querySelector('.in-title').value.trim(),
    url: row.querySelector('.in-url').value.trim(),
    attachment: row.querySelector('.in-attach').value.trim(),
    description: row.querySelector('.in-desc').value.trim(),
  })).filter(it => it.url || it.attachment);
  const msg = document.getElementById('add-msg');
  if (!items.length) { msg.className = 'msg err'; msg.textContent = '✗ 至少填一题 (web 填 URL / 其他填附件)'; return; }
  try {
    const r = await fetch('/api/add-challenges', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ items }),
    });
    const d = await r.json();
    if (r.ok) {
      msg.className = 'msg ok';
      msg.textContent = `✓ 入队 ${d.added.length} 道` + (d.failed ? `，失败 ${d.failed} 道` : '');
      document.getElementById('manual-rows').innerHTML = '';
      addRow();
    } else {
      msg.className = 'msg err'; msg.textContent = `✗ ${d.error || '入队失败'}`;
    }
  } catch (e) { msg.className = 'msg err'; msg.textContent = `✗ ${e}`; }
  setTimeout(() => msg.textContent = '', 5000);
  refresh();
}

/* ── 赛方题目平台接入 (拉题/开靶机/提交) ── */
async function connectPlatform() {
  const platform = document.getElementById('in-plat-name').value.trim();
  const base_url = document.getElementById('in-plat-url').value.trim();
  const api_key = document.getElementById('in-plat-key').value.trim();
  const msg = document.getElementById('plat-msg');
  let ov = null;
  try { ov = await (await fetch('/api/overview')).json(); } catch (e) {}
  const wasStandby = ov && ov.standby;
  if (!base_url || !api_key) { msg.className = 'msg err'; msg.textContent = '✗ base_url 和 api_key 必填'; return; }
  msg.className = 'msg'; msg.textContent = '接入中...';
  try {
    const r = await fetch('/api/connect-platform', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ platform, base_url, api_key }),
    });
    const d = await r.json();
    if (r.ok) {
      msg.className = 'msg ok';
      const started = wasStandby ? '，调度已开始' : '';
      msg.textContent = `✓ 已接入 ${d.platform || base_url} (${d.api_key})，拉到 ${d.challenges} 道题${started}`;
      document.getElementById('in-plat-key').value = '';  // 提交后即清，避免滞留明文
    } else { msg.className = 'msg err'; msg.textContent = `✗ ${d.error}`; }
  } catch (e) { msg.className = 'msg err'; msg.textContent = `✗ ${e}`; }
  setTimeout(() => msg.textContent = '', 8000);
  refresh();
}

/* ── Flags 面板 ── */
async function refreshFlags() {
  let d;
  try { d = await (await fetch('/api/flags')).json(); }
  catch (e) { return; }
  const list = document.getElementById('flags-list');
  const cnt = document.getElementById('flags-count');
  cnt.textContent = d.flags.length ? `${d.flags.length} 条` : '';
  if (!d.flags.length) {
    list.innerHTML = '<span class="flags-empty">暂无已解出的 flag</span>';
    return;
  }
  list.innerHTML = d.flags.map(f => `
    <div class="flag-item">
      <span class="f-time">${esc((f.time || '').slice(11, 19))}</span>
      <span class="f-title">${esc(f.title || f.cid)}</span>
      <span class="f-flag">${esc(f.flag)}</span>
      <span class="f-tag ${f.auto_submitted ? 'auto' : 'manual'}">${f.auto_submitted ? 'API 已提交' : '手动'}</span>
    </div>`).join('');
  list.scrollTop = 0;  // 最新在最前，滚回顶部
}

/* ── 总览 ── */
async function refresh() {
  let d;
  try { d = await (await fetch('/api/overview')).json(); }
  catch (e) { return; }

  document.getElementById('slots').textContent = `${d.running}/${d.max_solvers}`;
  document.getElementById('attempted').textContent = `${d.attempted}/${d.max_challenges}`;
  document.getElementById('solved').textContent = d.solved;
  document.getElementById('score').textContent = d.score_earned;
  document.getElementById('paused-badge').style.display = d.paused ? '' : 'none';
  document.getElementById('standby-badge').style.display = d.standby ? '' : 'none';
  document.getElementById('btn-pause').textContent = d.paused ? '恢复调度' : '暂停调度';
  document.getElementById('btn-pause').className = d.paused ? 'btn btn-go' : 'btn btn-warn';
  document.getElementById('in-solvers').placeholder = d.max_solvers;
  document.getElementById('in-challenges').placeholder = d.max_challenges;
  const pb = document.getElementById('plat-badge');
  if (d.platform_connected) {
    pb.className = 'badge plat-on';
    const parts = [d.platform_name, d.platform_base_url].filter(Boolean);
    pb.textContent = `平台: ${parts.join(' · ') || 'mock'}`;
  } else {
    pb.className = 'badge plat-off'; pb.textContent = '平台: 未接入';
  }
  const lb = document.getElementById('llm-badge');
  if (d.llm && d.llm.configured) {
    lb.className = 'badge llm-on';
    lb.textContent = `模型: ${d.llm.platform || 'LLM'}${d.llm.model ? ' · ' + d.llm.model : ''}`;
    lb.title = `${d.llm.base_url} (key ${d.llm.api_key})`;
  } else {
    lb.className = 'badge llm-off';
    lb.textContent = '模型: 未接入';
    lb.title = '引擎配置 llm.yaml 未填写，按本机默认登录态运行';
  }

  const tb = document.getElementById('tbody');
  tb.innerHTML = d.challenges.map(c => {
    const st = `<span class="st st-${esc(c.status)}">${esc(c.status)}</span>`;
    const src = c.source === 'manual' ? '<span class="src-tag">手动</span>' : ''
        + (c.flag_count > 1 ? `<span class="src-tag" style="color:#bc8cff;border-color:#bc8cff">⚑×${c.flag_count} 已得${c.flags_correct}</span>` : '');
    const title = `<div class="title-cell"><b>${esc(c.title)}</b>${src}<br><span>${esc(c.id)}</span></div>`;
    const flag = c.flag ? `<span class="flag-cell">${esc(c.flag)}</span>` : '-';
    const elapsed = c.elapsed != null ? fmtElapsed(c.elapsed) : '-';
    const last = c.last_submit_status || '-';
    let ops = '';
    if (c.is_running) ops += `<button class="btn btn-danger btn-mini" onclick="stopSolver('${esc(c.id)}')">终止</button> `;
    if (c.has_logs || c.is_running) ops += `<button class="btn btn-mini" onclick="openLogs('${esc(c.id)}')">日志</button>`;
    const err = c.error && !c.flag ? `<br><span class="err">${esc(c.error.slice(0, 80))}</span>` : '';
    return `<tr class="${c.is_running ? 'running-row' : ''}">
      <td>${st}</td><td>${title}${err}</td><td>${esc(c.type)}</td><td>${c.score}</td>
      <td>${c.solve_count}</td><td>${c.attempts}</td><td>${elapsed}</td>
      <td>${flag}</td><td>${esc(last)}</td><td>${ops}</td></tr>`;
  }).join('');
}

/* ── 控制 ── */
async function togglePause() {
  const d = await (await fetch('/api/overview')).json();
  await fetch(d.paused ? '/api/resume' : '/api/pause', { method: 'POST' });
  refresh();
}

async function stopSolver(cid) {
  if (!confirm(`确定终止 ${cid} 的 solver？`)) return;
  await fetch('/api/stop-solver', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ cid }),
  });
  refresh();
}

async function applyConfig() {
  const body = {};
  const s = document.getElementById('in-solvers').value;
  const c = document.getElementById('in-challenges').value;
  if (s) body.max_solvers = parseInt(s);
  if (c) body.max_challenges = parseInt(c);
  const r = await fetch('/api/config', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const msg = document.getElementById('config-msg');
  const d = await r.json();
  msg.className = r.ok ? 'msg ok' : 'msg err';
  msg.textContent = r.ok ? '✓ 已更新' : `✗ ${d.error}`;
  setTimeout(() => msg.textContent = '', 3000);
  refresh();
}

/* ── 日志抽屉 ── */
function openLogs(cid) {
  document.getElementById('drawer-title').textContent = cid;
  document.getElementById('drawer').classList.add('open');
  document.getElementById('log-agent').textContent = '';
  document.getElementById('log-hermes').textContent = '';
  if (esAgent) esAgent.close();
  if (esHermes) esHermes.close();
  esAgent = new EventSource(`/api/logs/${encodeURIComponent(cid)}/agent`);
  esHermes = new EventSource(`/api/logs/${encodeURIComponent(cid)}/hermes`);
  esAgent.addEventListener('append', e => appendLog('log-agent', e.data));
  esHermes.addEventListener('append', e => appendLog('log-hermes', e.data));
}

function appendLog(id, text) {
  const el = document.getElementById(id);
  el.textContent += text + '\n';
  el.scrollTop = el.scrollHeight;
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  if (esAgent) esAgent.close();
  if (esHermes) esHermes.close();
}

addRow();
refresh();
refreshFlags();
setInterval(refresh, 2500);
setInterval(refreshFlags, 5000);
</script>
